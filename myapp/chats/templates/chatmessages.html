{% extends 'base.html' %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="row w-100 justify-content-center">

    <!-- Participants -->
    <div class="col-md-8 col-lg-3">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white text-center fs-5 fw-bold rounded-top-4">
          Group Members
        </div>
        <div id="participants_name" class="card-body p-3"
          style="height: 400px; overflow-y: auto; background: #f9f9f9; scroll-behavior: smooth;">
        </div>
      </div>
    </div>

    <!-- Chat Window -->
    <div class="col-md-8 col-lg-9">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white text-center fs-5 fw-bold rounded-top-4" id="room-title">
          Chat Room
        </div>

        <!-- Update/Delete Buttons -->
        <div class="d-flex justify-content-end p-2">
          <button class="btn btn-info btn-sm me-2" id="reset-room-btn">Reset</button>
          <button class="btn btn-warning btn-sm me-2" id="update-room-btn">Update Chat</button>
          <button class="btn btn-danger btn-sm" id="delete-room-btn">Delete Chat</button>
        </div>

        <!-- Chat Box -->
        <div id="chat-box" class="card-body p-3"
          style="height: 400px; overflow-y: auto; background: #f9f9f9; scroll-behavior: smooth;">
        </div>

        <!-- Input -->
        <div class="card-footer bg-white border-0 rounded-bottom-4">
          <div class="input-group">
            <input type="text" id="message-input" class="form-control rounded-start-4"
              placeholder="Type your message...">
            <button class="btn btn-success rounded-end-4" id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const accessToken = localStorage.getItem('access_token');
  const roomId = '{{ room_id }}';
  const chatBox = document.getElementById("chat-box");
  const participantsDiv = document.getElementById("participants_name");
  const roomTitle = document.getElementById("room-title");
  const sendBtn = document.getElementById("send-btn");
  const messageInput = document.getElementById("message-input");
  const loginUser = localStorage.getItem('receiver');
  let roomData = {};

  // track current action
  let currentAction = "send";
  let selectedMessageId = null;
  let selectedMessageContent = "";

  // WebSocket connection
  const socket = new WebSocket(
    `ws://127.0.0.1:8000/ws/chats/${roomId}/?token=${accessToken}`
  );

  socket.onopen = () => console.log("WebSocket connected");
  socket.onclose = e => console.error("WebSocket closed:", e);
  socket.onerror = e => console.error("WebSocket error:", e);

  // Handle incoming messages
  socket.onmessage = function (e) {
    const msgData = JSON.parse(e.data);
    if (msgData.type === 'chat_message') {
      appendMessage(msgData.id, msgData.sender, msgData.message);
    } else if (msgData.type === 'update_message') {
      const msgDiv = document.querySelector(`[data-id='${msgData.id}']`);
      if (msgDiv) msgDiv.querySelector(".msg-text").textContent = msgData.message;
    } else if (msgData.type === 'delete_message') {
      const msgDiv = document.querySelector(`[data-id='${msgData.id}']`);
      if (msgDiv) msgDiv.remove();
    }
  };

  // Fetch room details on load
  async function fetchRoomDetails() {
    try {
      const response = await fetch(`http://127.0.0.1:8000/chats/chatmessage/${roomId}/`, {
        method: 'GET',
        headers: {
          'Authorization': "Bearer " + accessToken,
          'Content-Type': 'application/json'
        }
      });
      roomData = await response.json();

      if (response.ok) {
        roomTitle.textContent = `Chat Room: ${roomData.room_name}`;
        renderParticipants(roomData.participants);
        renderMessages(roomData.messages);
      } else {
        console.error('Error fetching room details:', roomData);
      }
    } catch (error) {
      console.error('Error fetching room details:', error);
    }
  }

  // Render all participants once
  function renderParticipants(participants) {
    participantsDiv.innerHTML = '';
    participants.forEach(name => {
      const div = document.createElement('div');
      div.classList.add('d-flex', 'mb-2', 'justify-content-start');
      div.innerHTML = `
        <div class="bg-light border rounded-4 p-2 mb-1">
          <small class="fw-bold text-success">${name}</small>
        </div>`;
      participantsDiv.appendChild(div);
    });
  }

  // Render full chat history
  function renderMessages(messages) {
    chatBox.innerHTML = '';
    messages.forEach(msg => {
      appendMessage(msg.id, msg.sender, msg.content);
    });
  }

  // Append a single new message
  function appendMessage(id, sender, content) {
    const div = document.createElement('div');
    div.classList.add('d-flex', 'mb-2');
    div.setAttribute("data-id", id);

    if (sender === loginUser) {
      // own message (right side)
      div.classList.add('justify-content-end');
      div.innerHTML = `<div class="bg-primary text-white rounded-4 p-2 msg-text">${content}</div>`;

      // only allow selecting own messages
      div.addEventListener("click", () => {
        selectedMessageId = id;
        selectedMessageContent = content;
        messageInput.value = content;
      });
    } else {
      // other user's message (left side)
      div.classList.add('justify-content-start');
      if (roomData.participants.length > 2) {
        div.innerHTML = `<div class="bg-light border rounded-4 p-2">
                         <small class="fw-bold text-success">${sender}</small> 
                         <span class="msg-text">${content}</span>
                       </div>`;
      } else {
        div.innerHTML = `<div class="bg-light border rounded-4 p-2 msg-text">${content}</div>`;
      }

    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

// update or delete message fetch 
async function updateOrDeleteMessage() {
  if (!selectedMessageId) return alert("Select a message first!");

  let url = "";
  let method = "";
  let body = null;

  if (currentAction === "update") {
    url = `http://127.0.0.1:8000/chats/chatmessageupdate/${selectedMessageId}/`;
    method = "PATCH";   
    body = JSON.stringify({ content: messageInput.value.trim() });
  } else if (currentAction === "delete") {
    url = `http://127.0.0.1:8000/chats/chatmessagedelete/${selectedMessageId}/`;
    method = "DELETE";
  }

  try {
    const response = await fetch(url, {
      method: method,
      headers: {
        'Authorization': "Bearer " + accessToken,
        'Content-Type': 'application/json'
      },
      body: body
    });

    if (response.ok) {
      if (currentAction === "update") {
        // update text in UI without reload
        const msgDiv = document.querySelector(`[data-id='${selectedMessageId}']`);
        if (msgDiv) msgDiv.querySelector(".msg-text").textContent = messageInput.value.trim();
      } else if (currentAction === "delete") {
        // remove from UI
        const msgDiv = document.querySelector(`[data-id='${selectedMessageId}']`);
        if (msgDiv) msgDiv.remove();
      }
      resetAction();
    } else {
      const data = await response.json();
      console.error('Error:', data);
      alert('Error: ' + (data.detail || 'Operation failed'));
    }
  } catch (error) {
    console.error('Error:', error);
    alert('Error: ' + error.message);
  }
}
  // Send button logic
sendBtn.addEventListener("click", () => {
  if (currentAction === "send") {
    const message = messageInput.value.trim();
    if (message === "") return;
    socket.send(JSON.stringify({
      type: "chat_message",
      message: message,
    }));
    messageInput.value = "";
    setTimeout(() => {
      location.reload();
    }, 100);
  } else {
    // run update/delete
    updateOrDeleteMessage();
  }
});


  // Update button click
  document.getElementById("update-room-btn").addEventListener("click", () => {
    if (!selectedMessageId) return alert("Select a message first!");
    currentAction = "update";
    sendBtn.textContent = "Update";
  });



  // Delete button click
  document.getElementById("delete-room-btn").addEventListener("click", () => {
    if (!selectedMessageId) return alert("Select a message first!");
    currentAction = "delete";
    sendBtn.textContent = "Delete";
  });

  function resetAction() {
    currentAction = "send";
    selectedMessageId = null;
    selectedMessageContent = "";
    messageInput.value = "";
    sendBtn.textContent = "Send";
  }

  // Reset button click
  document.getElementById("reset-room-btn").addEventListener("click", () => {
    resetAction();
  });
  // Load initial data
  fetchRoomDetails();
</script>
{% endblock %}
