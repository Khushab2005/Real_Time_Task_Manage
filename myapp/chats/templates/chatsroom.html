{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="margin-top: 600px;">
  <div class="row justify-content-center g-4" style="margin-top: 300px; margin-bottom: 300px;">

    <!-- Create Chat Room -->
    <div class="col-md-6">
      <form id="create_room_form" class="card shadow-lg p-4">
        <h4 class="mb-4 text-center text-primary">Create Chat Room</h4>

        <!-- Success & Error messages -->
        <div id="form_success" class="alert alert-success d-none" role="alert"></div>
        <div id="form_error" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Room Name</label>
          <input type="text" class="form-control" placeholder="Enter room name" id="name">
        </div>

        <!-- Multi-select with search -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Select Users</label>
          <select class="form-select users-select" id="users_select" multiple="multiple" required></select>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">+ Create Room</button>
      </form>
    </div>

    <!-- Chat Rooms List -->
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
          <i class="bi bi-chat-dots-fill me-2"></i> Chat Rooms
        </div>
        <ul class="list-group list-group-flush" id="room_list" style="max-height: 400px; overflow-y: auto;">
          <!-- Rooms will load here -->
        </ul>
      </div>
    </div>

  </div>
</div>
<script>
  // Activate Select2
  $(document).ready(function () {
    $('.users-select').select2({
      placeholder: "Search and select users",
      allowClear: true,
      width: '100%'
    });
  });

  // List Rooms chats
  let allrooms = [];
  async function list_rooms() {
    const accessToken = localStorage.getItem('access_token');
    const room_list = document.getElementById('room_list');
    room_list.innerHTML = ' ';


    try {
      const response = await fetch('http://127.0.0.1:8000/chats/chatroomlist/', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();


      if (response.ok) {
        allrooms = data;
        renderRooms(allrooms);
      } else {
        console.error('Error fetching rooms:', data);
      }

    }
    catch (error) {
      console.error('Error fetching rooms:', error);
    }

    try {
      const response = await fetch('http://127.0.0.1:8000/chats/alldata/', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();

      if (response.ok) {
        allrooms = data;
        renderAllUsers(allrooms);
      } else {
        console.error('Error fetching all users:', data);
      }
    }
    catch (error) {
      console.error('Error fetching all users:', error);
    }

  }





  function renderRooms(rooms) {
    const roomList = document.getElementById('room_list');
    const loginuser = localStorage.getItem('receiver');
    roomList.innerHTML = '';

    rooms.forEach(room => {
      console.log("1");
      console.log(room);
      const listItem = document.createElement('li');
      listItem.classList.add('list-group-item', 'border-0', 'p-0');
      listItem.style.cursor = 'pointer';

      const roomBtn = document.createElement('button');
      roomBtn.classList.add('btn', 'w-100', 'd-flex', 'justify-content-between', 'align-items-center', 'py-2', 'px-3', 'mb-2');

      if (room.created_by === loginuser) { // use correct field from API
        roomBtn.classList.add('btn-outline-success');
        roomBtn.innerHTML = `
        <span class="fw-bold text-dark">${room.room_name}</span>
        <div class="d-flex align-items-center">
            <button class="btn btn-danger badge  delete-room-btn rounded-pill" style="margin-right: 10px;" data-room-id="${room.id}">Delete</button>
            <span class="badge bg-success rounded-pill">Group Admin</span>
        </div>
      `;
      } else {
        roomBtn.classList.add('btn-outline-primary');
        roomBtn.innerHTML = `
        <span class="fw-bold text-dark">${room.room_name}</span>
        <span class="badge bg-primary rounded-pill">Joined</span>
      `;
      }

      roomBtn.addEventListener("click", () => {
        window.location.href = `/chats/chatmessagespage/${room.id}/`;
      });

      listItem.appendChild(roomBtn);
      roomList.appendChild(listItem);
    });

    // Attach event listeners to delete buttons
    document.querySelectorAll('.delete-room-btn').forEach(button => {
      button.addEventListener('click', async (e) => {
        e.stopPropagation(); // Prevent triggering the room button click event
        const roomId = button.getAttribute('data-room-id');
        const accessToken = localStorage.getItem('access_token');

        if (!confirm('Are you sure you want to delete this room?')) {
          return;
        }
        try {
          const response = await fetch(`http://127.0.0.1:8000/chats/chatroomdelete/${roomId}/`, { 
            method: 'DELETE',
            headers: {  
              'Authorization': "Bearer " + accessToken,
              'Content-Type': 'application/json'
            }
          }); 

          if (response.ok) {
            list_rooms();
            console.log('Room deleted successfully');
          } else {
            console.error('Error deleting room');
          }
        } catch (error) {
          console.error('Error deleting room:', error);
        }
      });
    });

  }


  function renderAllUsers(users) {
    const usersSelect = document.getElementById('users_select');
    const loginuser = localStorage.getItem('receiver');

    usersSelect.innerHTML = ''; // clear old list
    users.forEach(user => {
      if (user.name === loginuser) return;
      const option = document.createElement('option');
      option.value = user.id;
      option.textContent = user.name;
      usersSelect.appendChild(option);
    });
  }

  // Call the function
  list_rooms();

  document.getElementById('create_room_form').addEventListener("submit", async function (e) {
    e.preventDefault();

    const successBox = document.getElementById('form_success');
    const errorBox = document.getElementById('form_error');

    // Reset messages
    successBox.classList.add('d-none');
    errorBox.classList.add('d-none');

    const accessToken = localStorage.getItem("access_token");
    const name = document.getElementById('name').value;
    //const select_room_type = document.getElementById('select_room_type').value;
    const selectedUsers = Array.from(document.getElementById("users_select").selectedOptions)
      .map(option => option.value);

    const data = {
      room_name: name,
      // room_type: select_room_type,
      receiver_id: selectedUsers
    };

    try {
      const response = await fetch("http://127.0.0.1:8000/chats/chatroomlist/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + accessToken
        },
        body: JSON.stringify(data)
      });

      const responseData = await response.json();

      if (response.ok) {
        successBox.innerText = " Room created successfully!";
        successBox.classList.remove('d-none');
        list_rooms();
        document.getElementById("create_room_form").reset();
      } else {
        errorBox.innerText = JSON.stringify(responseData.room_name, null, 2);
        errorBox.classList.remove('d-none');
        console.error('Error creating room:', responseData);
      }

    } catch (error) {
      console.error('Error creating room:', error);
      errorBox.innerText = "Something went wrong. Please try again.";
      errorBox.classList.remove('d-none');
    }
  });



</script>
{% endblock %}
