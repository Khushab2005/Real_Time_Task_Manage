{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro-Coder</title>

  <!-- Bootstrap 5 CSS CDN -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <!-- jQuery (required for Select2) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Select2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>



</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand navbar-dark bg-dark fixed-top ">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Pro-Coder</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
        <ul class="navbar-nav me-3">
          <li class="nav-item"><a class="nav-link active" href="{% url 'loginpage' %}" id="loginLink">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="#" id="logoutLink" style="display:none">Logout</a></li>
          <li class="nav-item"><a class="nav-link active" href="{% url 'chatsroom' %}" id="chatslink"
              style="display: none;">chats</a></li>
        </ul>


        <span class="navbar-text text-white" id="navbar-username">
          Welcome 👋
        </span>
      </div>

  </nav>

  <!-- Content Placeholder -->

  {% block content %}

  {% endblock %}


  <!-- Footer -->
  <footer class="mt-auto">
    <div class="container text-center">
      <div class="row">

        <div class="col-md-6">
          <h5>Links</h5>
          <a href="#">Privacy Policy</a><br>
          <a href="#">Terms of Use</a>
        </div>
        <div class="col-md-6">
          <h5>Contact</h5>
          <p>Email: info@example.com</p>
          <p>Phone: +91-1234567890</p>
        </div>
      </div>
      <div class="footer-bottom mt-3">
        &copy; 2025 Pro-coder. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="{% static 'js/script.js' %}"></script>
  <script>


    document.addEventListener("DOMContentLoaded", function () {
      const loginLink = document.getElementById("loginLink");
      const logoutLink = document.getElementById("logoutLink");
      const chatslink = document.getElementById("chatslink");


      if (localStorage.getItem("access_token")) {
        loginLink.style.display = "none";
        logoutLink.style.display = "block";
        chatslink.style.display = "block";
      }

      logoutLink.addEventListener("click", function (e) {
        e.preventDefault();
        localStorage.removeItem("access_token");
        localStorage.removeItem("refresh_token");
        window.location.href = "{% url 'loginpage' %}";
      }

      );
    });

  </script>
</body>

</html>
